# Channel configuration. Every stage of the pipeline reads this file.
# Change the niche, voice, format and publishing rules here, not in code.

channel:
  name: "Evidence Bites"            # placeholder: use your channel's name
  niche: "practical health tips backed by the latest medical research"
  audience: "adults 25-60 who want simple, science-backed habits"
  language: en
  # Free Microsoft Edge neural voices. List them with:  edge-tts --list-voices
  voice: en-US-AndrewMultilingualNeural
  voice_rate: "+6%"

format:
  type: short                       # short = 9:16 vertical (Shorts), long = 16:9
  target_seconds: 50                # Shorts: keep 35-58 s. Long-form: 300-600 s.
  fps: 30

research:
  # Sources: pubmed, google_trends, youtube_popular, rss
  sources: [pubmed, google_trends]
  pubmed:
    # Each video is built on recent high-quality evidence for one of these themes.
    # Queries accept full PubMed syntax, e.g. '"medication adherence"[tiab]'.
    queries:
      - sleep
      - exercise
      - "resistance training"
      - nutrition
      - "gut microbiome"
      - "blood pressure"
      - "blood glucose"
      - stress
      - "mental health"
      - "healthy aging"
      - "medication adherence"
    days: 180                       # how far back to look
    per_query: 4
    publication_types:
      - "systematic review"
      - "meta-analysis"
      - "randomized controlled trial"
  google_trends:
    geo: US
  youtube_popular:
    region: US
    category_id: "26"               # 26 Howto & Style, 27 Education, 28 Science & Tech
  rss:
    feeds: []                       # any RSS/Atom URLs, e.g. a journal or news feed

writer:
  model: claude-opus-5-5
  effort: high
  fact_check: true                  # second, independent Claude pass against the sources
  require_sources: true             # every factual claim must cite a source from research
  rules:
    - "Only state what the cited sources support. Name the study type and who was studied (e.g. 'a 2026 meta-analysis of 24 trials in adults over 60')."
    - "Never turn an association into a cause. Say 'linked to' for observational evidence."
    - "No dosing, no medication changes, no diagnosis. Point viewers to their clinician for anything personal."
    - "Never claim a cure. No fear-mongering, no miracle language, no 'doctors hate this'."
    - "End with one concrete action and one tip for actually sticking with it."
    - "Hook in the first sentence with the most surprising, accurate finding."

visuals:
  providers: [pexels, pixabay]      # free API keys; with no key, styled title cards are used
  fallback_query: "healthy lifestyle"  # used when a scene's own search finds nothing

captions:
  font: assets/fonts/Anton-Regular.ttf
  font_size: 140                    # ASS units for 1080 px width; scaled for long-form
  words_per_caption: 3
  color: "#FFFFFF"
  highlight: "#FFE600"
  outline: "#000000"

music:
  dir: assets/music                 # drop royalty-free .mp3 files here (YouTube Audio Library)
  volume: 0.07

youtube:
  category_id: "26"
  # With publish_delay_hours > 0 videos upload as private and go public automatically
  # after the delay. That gives you a window to watch each one in YouTube Studio first.
  publish_delay_hours: 6
  privacy_status: public            # used when publish_delay_hours is 0
  made_for_kids: false
  contains_synthetic_media: false   # set true if you add realistic AI people, places or events
  upload_thumbnail: true            # custom thumbnails need a phone-verified channel
  description_footer: |
    Educational content only, not medical advice. Talk to your doctor or pharmacist before changing your diet, exercise, supplements or medication.
    Narration is AI-generated. Stock footage from Pexels and Pixabay.
