name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["content/**", "data/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest -q

      - name: Validate queued scripts
        run: |
          if ls content/queue/*.json >/dev/null 2>&1; then python -m autopilot validate; fi

      - name: Offline render of the sample script
        run: python -m autopilot produce examples/sample-script.json --offline

      - uses: actions/upload-artifact@v4
        with:
          name: sample-render
          path: work/*/final.mp4
          retention-days: 7
